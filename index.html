<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Email Template Hub</title>
<style>
body { font-family: Arial; padding: 20px; background:#f5f5f5; }
h1 { text-align:center; }

.template {
  background:#fff;
  padding:15px;
  margin:15px 0;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

textarea {
  width:100%;
  height:120px;
  margin-top:10px;
}

button {
  margin-top:8px;
  padding:6px 12px;
  cursor:pointer;
}

.search {
  width:100%;
  padding:10px;
  margin-bottom:20px;
}
</style>
</head>

<body>

<h1>📧 Email Template Hub</h1>

<input class="search" placeholder="Search templates..." onkeyup="search(this.value)">

<h2>📦 Order Issues</h2>

<div class="template">
<h3>Delivery Delay Apology</h3>
<textarea>Dear customer,
We are very sorry for the delay of your order. We are working hard to deliver it as soon as possible.</textarea>
<button onclick="copy(this)">Copy</button>
</div>

<div class="template">
<h3>Lost Package</h3>
<textarea>Dear customer,
We are sorry your package has not arrived. We will contact logistics immediately.</textarea>
<button onclick="copy(this)">Copy</button>
</div>

<h2>💰 Refund & Return</h2>

<div class="template">
<h3>Refund Confirmation</h3>
<textarea>Dear customer,
Your refund has been successfully processed and will appear shortly.</textarea>
<button onclick="copy(this)">Copy</button>
</div>

<script>
function copy(btn){
  let text = btn.previousElementSibling;
  text.select();
  document.execCommand("copy");
  alert("Copied!");
}

function search(v){
  let items = document.querySelectorAll(".template");
  items.forEach(i=>{
    i.style.display = i.innerText.toLowerCase().includes(v.toLowerCase())
    ? "block" : "none";
  });
}
</script>

</body>
</html>
